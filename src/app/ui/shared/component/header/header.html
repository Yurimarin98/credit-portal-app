<header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
    <div>
      <h1 class="h3 fw-bold text-dark mb-0">Credit Request APP</h1>
    </div>
 
    @if (session) {
    <div class="card bg-light border-0 px-3 py-2 shadow-sm">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center fw-bold"
                style="width: 35px; height: 35px;">
                {{ session?.username?.charAt(0)?.toUpperCase()}}
            </div>
            <div>
                <span class="d-block fw-semibold text-dark small">{{ session?.username }}</span>
            </div>
        </div>
    </div>
    }
</header>
